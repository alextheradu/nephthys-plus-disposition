{
    "display_information": {
        "name": "Benjamin",
        "description": "Disposition's support bot",
        "long_description": "Benjamin helps the Disposition team manage support threads, assign tickets, share FAQ resources, and keep track of questions that need a reply.",
        "background_color": "#141414"
    },
    "features": {
        "app_home": {
            "home_tab_enabled": true,
            "messages_tab_enabled": true,
            "messages_tab_read_only_enabled": false,
            "agent_tasks_enabled": true
        },
        "bot_user": {
            "display_name": "Benjamin",
            "always_online": true
        },
        "shortcuts": [
            {
                "name": "Delete message",
                "type": "message",
                "callback_id": "delete_bot_message",
                "description": "Delete your own message or a message sent by Benjamin"
            }
        ]
    },
    "oauth_config": {
        "scopes": {
            "user": [
                "chat:write"
            ],
            "bot": [
                "channels:history",
                "channels:read",
                "channels:manage",
                "chat:write",
                "chat:write.customize",
                "chat:write.public",
                "groups:history",
                "groups:read",
                "groups:write",
                "im:history",
                "im:read",
                "im:write",
                "metadata.message:read",
                "reactions:read",
                "reactions:write",
                "users:read",
                "files:write",
                "files:read",
                "mpim:read"
            ]
        },
        "pkce_enabled": false
    },
    "settings": {
        "event_subscriptions": {
            "bot_events": [
                "app_home_opened",
                "member_joined_channel",
                "member_left_channel",
                "message.channels",
                "message.groups",
                "message.im",
                "message_metadata_posted"
            ],
            "request_url": "https://benjamin.example.com/slack/events",
            "metadata_subscriptions": [
                {
                    "app_id": "*",
                    "event_type": "nephthys_plus_forward"
                }
            ]
        },
        "interactivity": {
            "is_enabled": true,
            "message_menu_options_url": "https://benjamin.example.com/slack/events",
            "request_url": "https://benjamin.example.com/slack/events"
        },
        "org_deploy_enabled": false,
        "socket_mode_enabled": false,
        "is_mcp_enabled": false,
        "token_rotation_enabled": false,
        "app_level_token_rotation_enabled": false
    }
}
